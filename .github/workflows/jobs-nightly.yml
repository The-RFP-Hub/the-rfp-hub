name: Nightly maintenance jobs

# Runs the API's scheduled maintenance work as ONE-OFF CONTAINER TASKS on the deployed image, and
# is the workflow the open-data export chains itself to.
#
# WHY A CONTAINER TASK AND NOT AN ENDPOINT. Starting a job needs a credential. A public endpoint
# would need one that lives somewhere a workflow can read — a shared token, in repository secrets,
# accepted by the internet-facing API forever. The deploy workflows already hold AWS credentials
# that can start ECS tasks, and the image already exposes the entry point
# (`node packages/api/dist/jobs.js <job>`, built by tsup alongside migrate/seed/export). So the
# schedule uses the credential that already exists, the API grows no machine-authenticated surface,
# and `POST /v1/admin/jobs/{job}/run` stays what it is: a signed-in administrator's convenience.
#
# ORDERING IS A DEPENDENCY, NOT A SECOND CRON. "Staleness at 03:00, export at 03:17" guarantees
# nothing — scheduled workflows start late routinely, and a late staleness run would publish a
# dataset still advertising closed programmes. So there is ONE cron here, the jobs are ordered by
# `needs`, and `nightly-export.yml` triggers on THIS workflow completing successfully.
#
# WHAT A FAILURE COSTS, stated plainly: because the export is chained to this workflow's
# conclusion, a job that fails holds tonight's dataset publication. That is the deliberate trade —
# publishing a snapshot whose staleness pass did not run is worse than publishing a day late, the
# export is idempotent and the next night republishes, and `workflow_dispatch` on either workflow
# recovers it immediately. The runner exits 0 for every outcome that is not an error, including a
# job that declined because another run held its advisory lock and a job whose feature is not
# configured, so only a real failure reaches here.
#
# WHICH DEPLOYMENT IS MAINTAINED IS EXPLICIT, AND THE SCHEDULE MEANS PRODUCTION. The open-data
# export this workflow gates reads the PRODUCTION API, so a scheduled chain that authenticated with
# staging credentials would either fail outright or quietly maintain the wrong database and publish
# a snapshot whose staleness pass never touched it. So the environment is a first-class input:
# blank (the schedule) means `production`, and an operator maintaining staging has to say so. The
# credentials and the ECS resource names are then selected by that name — `PRODUCTION_AWS_*` /
# `PRODUCTION_MAINTENANCE_ECS_*`, exactly the pairing production.yml uses — through an INDEX lookup
# rather than an `&&`/`||` fallback, because a fallback would silently reach for the production
# resources whenever a staging variable was unset.

on:
  schedule:
    # One cron for the whole chain. See packages/api/docs/jobs.md for the ordering it implies.
    - cron: "5 1 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to maintain. The schedule always means production."
        required: true
        type: choice
        default: production
        options:
          - production
          - staging
      job:
        description: "Run a single job instead of the whole chain (blank = all)."
        required: false
        default: ""

# This workflow writes nothing to the repository; it reads the runner script out of a checkout and
# starts container tasks with AWS credentials supplied as secrets.
permissions:
  contents: read

# One maintenance chain at a time. Two overlapping runs would be caught by the database advisory
# lock each job takes — they would report `skipped: "locked"` and exit 0 — but a queue of skipped
# runs is not a useful thing to have, and the second one would trigger a second export.
concurrency:
  group: jobs-nightly
  cancel-in-progress: false

env:
  # The environment this run maintains, and the prefix every credential and resource name is
  # selected by. `inputs.environment` is empty on a schedule, so a scheduled chain is PRODUCTION —
  # the deployment the open-data export reads. The two literals here are non-empty, so the
  # `&&`/`||` idiom is safe in this one place; the lookups it drives are index lookups precisely so
  # an unset variable stays unset instead of falling back to the other environment's.
  TARGET_ENV: ${{ inputs.environment || 'production' }}
  ENV_PREFIX: ${{ inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION' }}
  AWS_REGION: us-east-1
  # Blank on a schedule, a job name when an operator dispatched one deliberately.
  SELECTED: ${{ github.event.inputs.job }}

jobs:
  # The five jobs that depend on nothing and on each other: the two analytics sweeps and the three
  # backfills. Run in parallel, each with its own advisory lock, and `fail-fast: false` so one
  # failing does not cancel the others mid-write.
  maintenance:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job:
          - analytics-rollup
          - retention
          - embedding-backfill
          - verification-backfill
          - account-enrichment
    steps:
      # `persist-credentials: false`: nothing here pushes, and a credential left in `.git/config`
      # is inherited by every later step for no reason. Same rule as nightly-export.yml.
      - name: Checkout
        if: env.SELECTED == '' || env.SELECTED == matrix.job
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        if: env.SELECTED == '' || env.SELECTED == matrix.job
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets[format('{0}_AWS_ACCESS_KEY_ID', env.ENV_PREFIX)] }}
          aws-secret-access-key: ${{ secrets[format('{0}_AWS_SECRET_ACCESS_KEY', env.ENV_PREFIX)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run ${{ matrix.job }}
        if: env.SELECTED == '' || env.SELECTED == matrix.job
        env:
          # Each one is the hosting account's own resource name rather than a fact about this
          # project, so they are repository VARIABLES, not literals in a public, source-neutral tree
          # (see scripts/check-neutral.mjs). Settings -> Secrets and variables -> Actions ->
          # Variables, one set per environment: PRODUCTION_MAINTENANCE_* and STAGING_MAINTENANCE_*.
          ECS_CLUSTER: ${{ vars[format('{0}_MAINTENANCE_ECS_CLUSTER', env.ENV_PREFIX)] }}
          ECS_TASK_DEFINITION: ${{ vars[format('{0}_MAINTENANCE_ECS_TASK_DEFINITION', env.ENV_PREFIX)] }}
          ECS_CONTAINER: ${{ vars[format('{0}_MAINTENANCE_ECS_CONTAINER', env.ENV_PREFIX)] }}
          ECS_SUBNETS: ${{ vars[format('{0}_MAINTENANCE_ECS_SUBNETS', env.ENV_PREFIX)] }}
          ECS_SECURITY_GROUPS: ${{ vars[format('{0}_MAINTENANCE_ECS_SECURITY_GROUPS', env.ENV_PREFIX)] }}
          VAR_PREFIX: ${{ env.ENV_PREFIX }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          JOB: ${{ matrix.job }}
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: .github/scripts/run-ecs-job.sh

  # Staleness runs LAST and alone. It closes past-due and long-inactive entries, and the open-data
  # export must observe that state rather than the state before it — which is the entire reason
  # nightly-export.yml is chained to this workflow instead of to a clock.
  staleness:
    name: staleness
    needs: [maintenance]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: env.SELECTED == '' || env.SELECTED == 'staleness'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        if: env.SELECTED == '' || env.SELECTED == 'staleness'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets[format('{0}_AWS_ACCESS_KEY_ID', env.ENV_PREFIX)] }}
          aws-secret-access-key: ${{ secrets[format('{0}_AWS_SECRET_ACCESS_KEY', env.ENV_PREFIX)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run staleness
        if: env.SELECTED == '' || env.SELECTED == 'staleness'
        env:
          ECS_CLUSTER: ${{ vars[format('{0}_MAINTENANCE_ECS_CLUSTER', env.ENV_PREFIX)] }}
          ECS_TASK_DEFINITION: ${{ vars[format('{0}_MAINTENANCE_ECS_TASK_DEFINITION', env.ENV_PREFIX)] }}
          ECS_CONTAINER: ${{ vars[format('{0}_MAINTENANCE_ECS_CONTAINER', env.ENV_PREFIX)] }}
          ECS_SUBNETS: ${{ vars[format('{0}_MAINTENANCE_ECS_SUBNETS', env.ENV_PREFIX)] }}
          ECS_SECURITY_GROUPS: ${{ vars[format('{0}_MAINTENANCE_ECS_SECURITY_GROUPS', env.ENV_PREFIX)] }}
          VAR_PREFIX: ${{ env.ENV_PREFIX }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          JOB: staleness
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: .github/scripts/run-ecs-job.sh
