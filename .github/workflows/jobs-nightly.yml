name: Nightly maintenance jobs

# Runs the API's maintenance work as ONE-OFF CONTAINER TASKS on the deployed image. It is the
# OPERATOR'S PATH ONLY: this workflow has no cron and starts nothing by itself.
#
# THE NIGHTLY CHAIN IS SCHEDULED OUTSIDE THIS REPOSITORY. An external scheduler runs the whole
# chain at 01:05 UTC against the same entry point this workflow starts
# (`node packages/api/dist/jobs.js <job> --json`). The ordering it owes is exactly one rule:
# analytics-rollup, retention, embedding-backfill, verification-backfill and notification-dispatch
# are INDEPENDENT of each other and may run in any order or in parallel, and STALENESS RUNS AFTER
# ALL OF THEM — running it earlier closes entries a source check was about to prove active.
# Running the six serially is one way to satisfy that, not the requirement.
#
# ONE CALLER OWNS THAT ORDERING, because nothing else can: per-job advisory locks exclude a job from
# ITSELF, never one job from another, so two callers whose windows overlap interleave and silently
# lose work while every run reports success. The contract is packages/api/docs/jobs.md section 4d.
#
# WHAT IS LEFT HERE IS A DISPATCH. An operator runs the chain (`job` = `all`) or one job by name —
# a recovery after a failed external run, or a check that the wiring works. Every step is guarded
# by that choice, so a dispatch starts exactly what was asked for and nothing else.
#
# WHY A CONTAINER TASK AND NOT AN ENDPOINT. Starting a job needs a credential. A public endpoint
# would need one that lives somewhere a workflow can read — a shared token, in repository secrets,
# accepted by the internet-facing API forever. The deploy workflows already hold AWS credentials
# that can start ECS tasks, and the image already exposes the entry point
# (`node packages/api/dist/jobs.js <job>`, built by tsup alongside migrate/seed/export). So a
# dispatch uses the credential that already exists, the API grows no machine-authenticated surface,
# and `POST /v1/admin/jobs/{job}/run` stays what it is: a signed-in administrator's convenience.
#
# THE OPEN-DATA EXPORT IS NOT CHAINED TO THIS WORKFLOW. `nightly-export.yml` runs on its OWN cron
# (`17 3 * * *`); nothing here triggers it and a failure here does not hold it back. Ordering
# between the export and the maintenance chain is by clock alone — which is why the external chain
# has to finish before 03:17, and is stated here so nobody plans around a dependency that does not
# exist.
#
# The runner exits 0 for every outcome that is not an error, including a job that declined because
# another run held its advisory lock and a job whose feature is not configured, so only a real
# failure reaches here.
#
# WHICH DEPLOYMENT IS MAINTAINED IS EXPLICIT. The open-data export reads the PRODUCTION API, so a
# run that authenticated with staging credentials would either fail outright or quietly maintain the
# wrong database. So the environment is a first-class input, `production` by default, and an
# operator maintaining staging has to say so. The credential and the cluster are then selected by
# that name — `PRODUCTION_AWS_*` with `PRODUCTION_ECS_CLUSTER`, exactly the pairing production.yml
# uses — through an INDEX lookup rather than an `&&`/`||` fallback, because a fallback would
# silently reach for the production cluster whenever the staging variable was unset.
#
# THIS WORKFLOW PROVISIONS NOTHING. A job is the deployed image with a different command, so it runs
# on the API SERVICE'S OWN task definition (`rfp-hub-<env>`) and inherits its image, its secrets and
# its roles; `run-ecs-job.sh` reads the service (`rfp-hub-<env>-service`) at run time for the
# subnets, security groups and launch type. The only repository variable it needs is the cluster —
# `<ENV>_ECS_CLUSTER`, which the deploy workflows already require and an operator has therefore
# already set. There is no separate maintenance task definition to keep in step with the service's
# secret list, which is a copy that would eventually be stale in exactly the way that matters.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment to maintain."
        required: true
        type: choice
        default: production
        options:
          - production
          - staging
      job:
        description: "Run a single job instead of the whole chain."
        required: false
        type: choice
        default: all
        # The maintenance-chain names from `packages/api/src/modules/services/jobs/registry.ts`.
        # `all` means this whole chain (`choice` options cannot be empty). A free-form string meant
        # a typo matched neither `matrix.job` nor `'staleness'` in every step's `if:` below,
        # skipping every guarded step and leaving a green run that did nothing.
        options:
          - all
          - analytics-rollup
          - retention
          - embedding-backfill
          - verification-backfill
          - notification-dispatch
          - staleness

# This workflow writes nothing to the repository; it reads the runner script out of a checkout and
# starts container tasks with AWS credentials supplied as secrets.
permissions:
  contents: read

# One maintenance chain at a time. Two overlapping runs would be caught by the database advisory
# lock each job takes — they would report `skipped: "locked"` and exit 0 — but a queue of skipped
# runs is not a useful thing to have, and a dispatch that races the external chain is a run that
# did nothing rather than a recovery.
concurrency:
  group: jobs-nightly
  cancel-in-progress: false

env:
  # The environment this run maintains, and the prefix the credential and the cluster are selected
  # by. The lookups it drives are index lookups precisely so an unset variable stays unset instead
  # of falling back to the other environment's.
  TARGET_ENV: ${{ inputs.environment || 'production' }}
  ENV_PREFIX: ${{ inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION' }}
  AWS_REGION: us-east-1
  # `all` or a single job name — the only two things a dispatch can mean now that nothing is
  # scheduled here. `|| 'all'` so a caller that omits the input entirely still runs the chain
  # rather than skipping every guarded step and reporting green.
  SELECTED: ${{ inputs.job || 'all' }}

jobs:
  # The five jobs that depend on nothing and on each other: the two analytics sweeps, two backfills,
  # and the notification-delivery backstop. They run in parallel, each with its own advisory lock,
  # and `fail-fast: false` so one failing does not cancel the others mid-write. Nothing here orders
  # them, deliberately — the only ordering the chain has is staleness after all of them, below.
  maintenance:
    name: ${{ matrix.job }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job:
          - analytics-rollup
          - retention
          - embedding-backfill
          - verification-backfill
          - notification-dispatch
    steps:
      # `persist-credentials: false`: nothing here pushes, and a credential left in `.git/config`
      # is inherited by every later step for no reason. Same rule as nightly-export.yml.
      - name: Checkout
        if: env.SELECTED == 'all' || env.SELECTED == matrix.job
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        if: env.SELECTED == 'all' || env.SELECTED == matrix.job
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets[format('{0}_AWS_ACCESS_KEY_ID', env.ENV_PREFIX)] }}
          aws-secret-access-key: ${{ secrets[format('{0}_AWS_SECRET_ACCESS_KEY', env.ENV_PREFIX)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run ${{ matrix.job }}
        if: env.SELECTED == 'all' || env.SELECTED == matrix.job
        env:
          # The cluster is the hosting account's own resource name rather than a fact about this
          # project, so it is a repository VARIABLE, not a literal in a public, source-neutral tree
          # (see scripts/check-neutral.mjs). It is the SAME variable the deploy workflow for this
          # environment reads, under Settings -> Secrets and variables -> Actions -> Variables, so
          # a deployment that exists has already set it. Everything else the task needs — the task
          # definition, the container, the service, the subnets, the security groups — is derived or
          # discovered by the runner (see .github/scripts/run-ecs-job.sh).
          ECS_CLUSTER: ${{ vars[format('{0}_ECS_CLUSTER', env.ENV_PREFIX)] }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          JOB: ${{ matrix.job }}
          # Always true: this workflow only ever dispatches. An operator asking "is the wiring
          # correct" gets a failure when the cluster variable or the service is missing, never the
          # green warning the runner keeps for a scheduled caller.
          DISPATCHED: "true"
        run: .github/scripts/run-ecs-job.sh

  # Staleness runs AFTER ALL FIVE, which is what `needs: [maintenance]` is for and is the whole of
  # the chain's ordering: a successful source check writes `lastSeenAt` and resets the staleness
  # clock, so staleness reading that state before verification finished closes entries a check was
  # about to prove active — with both runs green (packages/api/docs/jobs.md section 4d). The
  # external scheduler owes the same rule and nothing more.
  staleness:
    name: staleness
    needs: [maintenance]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        if: env.SELECTED == 'all' || env.SELECTED == 'staleness'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        if: env.SELECTED == 'all' || env.SELECTED == 'staleness'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets[format('{0}_AWS_ACCESS_KEY_ID', env.ENV_PREFIX)] }}
          aws-secret-access-key: ${{ secrets[format('{0}_AWS_SECRET_ACCESS_KEY', env.ENV_PREFIX)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run staleness
        if: env.SELECTED == 'all' || env.SELECTED == 'staleness'
        env:
          ECS_CLUSTER: ${{ vars[format('{0}_ECS_CLUSTER', env.ENV_PREFIX)] }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          JOB: staleness
          DISPATCHED: "true"
        run: .github/scripts/run-ecs-job.sh
