name: Notification email dispatch

# Deliberately separate from jobs-nightly.yml. The open-data export is chained to that workflow's
# success, and an email-provider outage must not hold dataset publication hostage.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which deployment should dispatch pending notification email."
        required: true
        type: choice
        default: production
        options:
          - production
          - staging

permissions:
  contents: read

concurrency:
  group: notification-dispatch-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

env:
  TARGET_ENV: ${{ inputs.environment || 'production' }}
  ENV_PREFIX: ${{ inputs.environment == 'staging' && 'STAGING' || 'PRODUCTION' }}
  AWS_REGION: us-east-1

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-access-key-id: ${{ secrets[format('{0}_AWS_ACCESS_KEY_ID', env.ENV_PREFIX)] }}
          aws-secret-access-key: ${{ secrets[format('{0}_AWS_SECRET_ACCESS_KEY', env.ENV_PREFIX)] }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Dispatch pending notification email
        env:
          ECS_CLUSTER: ${{ vars[format('{0}_ECS_CLUSTER', env.ENV_PREFIX)] }}
          TARGET_ENV: ${{ env.TARGET_ENV }}
          JOB: notification-dispatch
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
        run: .github/scripts/run-ecs-job.sh
