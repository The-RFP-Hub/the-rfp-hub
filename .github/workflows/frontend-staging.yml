# Deploys the frontend to its STAGING address on every push to main that could change it.
#
# WHY THE CLI AND NOT THE GIT INTEGRATION. Vercel's Git integration deploys branches, not tags,
# and this repository's release convention is "main is only ever staging; production moves on a
# tag" (see production.yml / frontend-production.yml). Driving both environments from the CLI in
# Actions keeps the two deploy paths identical in shape, auditable in one place, and able to bake
# the right NEXT_PUBLIC_* values per environment — those are inlined at build time, so WHICH
# environment's variables `vercel pull` fetches decides which API the shipped bundle talks to.
# The project's own git.deploymentEnabled turns the integration off for main (packages/frontend/
# vercel.json) so a push cannot double-deploy; feature-branch previews are untouched.
#
# Vercel's "preview" environment IS this project's staging — the alias below gives it the stable
# address. Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (project-scoped; Settings →
# General). Environment variables live in Vercel (Settings → Environment Variables), never here.
#
# `NEXT_PUBLIC_SITE_ORIGIN` MUST NOT BE SET on this (Preview) environment, and the step before the
# build fails the deploy if it is. Unset, this alias and every other preview resolve `noindex` /
# `Disallow: /` — Vercel reports `VERCEL_ENV=preview`, which claims no canonical origin — instead of
# competing with production in search results. See frontend-production.yml and the frontend README.
name: Staging frontend

on:
  push:
    branches: [main]
    # The frontend's build inputs only: its own package plus the workspace packages it bundles
    # (the validator and the schemas it precompiles) and the lockfile that pins them. The nightly
    # `exports/` commits and API-only changes deploy nothing here.
    paths:
      - "packages/frontend/**"
      - "packages/validate/**"
      - "packages/standard/**"
      - "tsconfig.base.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-staging.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only the newest main state matters; superseded staging builds are cancelled.
  group: frontend-staging
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `vercel build` runs the build ON THIS RUNNER and shells out to pnpm (detected from the
      # lockfile and the packageManager field) — on Vercel's own infrastructure pnpm is provided,
      # here it has to be installed or the build dies with `spawn pnpm ENOENT`.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # Pinned, not @latest: this CLI both builds and promotes the deployment, so "which tool ran"
      # must be a fact of the commit rather than whatever npm served that morning. Upgrading is a
      # deliberate edit to this file, in both frontend workflows together.
      - name: Install Vercel CLI
        run: npm install -g vercel@59.3.0

      # Fetches the PREVIEW environment's variables — this project's staging configuration —
      # into .vercel/ on the runner. Nothing is written into any container build context
      # (scripts/check-deploy.mjs's concern); the Vercel build consumes it in place.
      - name: Pull Vercel environment (preview = staging)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      # The mirror of the production workflow's guard, and the reason it is worth a step here too:
      # an origin set on this environment by mistake would put a second indexable copy of the same
      # directory in search results, competing with the real one.
      - name: Assert the pulled environment names no canonical origin
        run: node scripts/check-canonical-origin.mjs .vercel/.env.preview.local --expect none

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --token="$VERCEL_TOKEN"

      # The four canonical namespace prefixes must be proxied by the built output, or the apex
      # 404s every published identifier of the Standard the moment this deploy goes live. Their
      # presence in the artifact IS the fact "NEXT_PUBLIC_API_URL was present and valid at build
      # time": the rewrites are derived from it and vanish silently when it is missing, so this
      # asserts on the artifact rather than trusting the environment — and it runs BEFORE the
      # deploy, because a green deploy of a broken apex is the failure mode it exists to prevent.
      - name: Assert the canonical-namespace proxy survived the build
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const config = JSON.parse(readFileSync(".vercel/output/config.json", "utf8"));
            const haystack = JSON.stringify([config.routes ?? [], config.rewrites ?? []]);
            const missing = ["/schemas", "/meta", "/registries", "/ns"].filter(
              (prefix) => !haystack.includes(prefix),
            );
            if (missing.length > 0) {
              console.error(
                "canonical proxy missing from the built output for: " + missing.join(", ") +
                " — NEXT_PUBLIC_API_URL was absent or invalid at build time; refusing to ship a frontend that would 404 the published identifiers.",
              );
              process.exit(1);
            }
            console.log("canonical namespace proxy present: /schemas /meta /registries /ns");
          '

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "deployment_url=$url" >> "$GITHUB_OUTPUT"

      - name: Alias the staging domain
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_ORG_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: vercel alias "$DEPLOYMENT_URL" staging.ethrfps.app --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE"
