name: Nightly open-data export

# Publishes the open-data export into THIS repository — `exports/` on the default branch — and then
# verifies the publication from the outside before the job is allowed to go green.
#
# Why the data is committed here: the export needs somewhere public, immutable and versioned to
# live, and a repository already is all three. Every snapshot is a commit, so "what did the dataset
# say last Tuesday" is `git log`, and raw.githubusercontent.com serves the files over TLS with no
# bucket, no credentials and no infrastructure to keep alive. The trade is that a data commit lands
# on the same branch as the code, which is what the `paths-ignore: ['exports/**']` filters in ci.yml
# and staging.yml are for: publishing a dataset must never deploy a service.
#
# Why the data comes from the API rather than the database: this job needs no database credentials
# and no network path to Postgres. It publishes exactly what the public receives, which also makes
# the export a check ON the deployment — see packages/api/scripts/export-from-api.ts, which fails
# the run rather than publishing anything if the API disagrees with itself or serves a record the
# Standard rejects.
#
# A green run means PUBLISHED AND INDEPENDENTLY VERIFIED, never merely "ran": the `verify` job
# re-downloads what was pushed from the public URL and holds the deployment plus the published
# files to the M2 compliance criteria.
#
# THE RUN IS SPLIT IN THREE JOBS, AND THE SPLIT IS THE SECURITY BOUNDARY. Building the export
# means `pnpm install --frozen-lockfile` and then running the workspace, which is a few hundred
# third-party packages plus their lifecycle scripts. If that happened in the same job as the write
# token, any one of them could reach it: a job's steps share a process environment that earlier
# steps can extend through $GITHUB_ENV and $GITHUB_PATH, so a compromised dependency does not need
# to read `.git/config` — it can arrange for a later step to hand it whatever the runner has. So the
# token lives in a job that runs NOTHING from node_modules and nothing from this repository: it
# downloads an artifact, checks the file names against an allowlist, copies them into place and
# commits. `build` produces that artifact with `contents: read`; `verify` re-installs to run the
# compliance checker, also with `contents: read`, because that checker needs ajv and the built
# workspace validator and therefore must not sit in the publishing job either.
#
# HOW THE PUBLISH JOB GETS PAST THE MAIN RULESET. `main` requires a pull request and the `build`
# status check, and the job's own GITHUB_TOKEN is not — and cannot be made — a bypass actor for
# either. The job therefore pushes over SSH with a write DEPLOY KEY that the ruleset lists as a
# bypass actor. The private half lives in the `nightly-export-publisher` environment, whose branch
# policy admits only `main`, so a workflow on any other branch cannot even request it; the job
# still holds it only as an ssh key in `core.sshCommand`, never in `.git/config` or the environment,
# and only in the job that runs no third-party code. Rotating it is: new key pair, replace the
# deploy key (Settings → Deploy keys → "nightly-export publisher") and the environment secret.
#
# Every action is pinned to a full commit SHA, with the release it belongs to in the trailing
# comment. This is the one workflow in the repository that can WRITE to the default branch, so
# "which code ran" has to be a fact rather than whatever a mutable tag pointed at last night: a
# `v4` tag can be moved onto new code by whoever controls the action's repository, and a job with
# `contents: write` is exactly what such a move would be worth aiming at. Upgrading is then a
# deliberate edit to this file — read the release notes, change the SHA and the comment together.

on:
  workflow_dispatch:
  # Enabled after one manual dispatch (run 31742168996, 2026-08-13) published and verified a
  # snapshot end to end. Scheduled workflows are read from the DEFAULT BRANCH, so the cron only
  # fires once this file is on main.
  schedule:
    - cron: "17 3 * * *"

# The floor for every job in this file. `publish` raises its own to `contents: write` — it is the
# one job that writes a commit to the default branch, and the only one that can.
permissions:
  contents: read

# One publisher at a time, and never cancelled part-way. Two overlapping runs would race on the
# same six file names and push two snapshots at each other; a run cancelled between the commit and
# the verification would leave a published dataset nobody checked.
concurrency:
  group: nightly-export
  cancel-in-progress: false

env:
  API_BASE_URL: https://api.ethrfps.app
  EXPORT_ROOT_URL: https://raw.githubusercontent.com/The-RFP-Hub/the-rfp-hub/main/exports


jobs:
  # ── BUILD ───────────────────────────────────────────────────────────────────────────────────────
  # Installs, builds and runs the export. This is the job that executes third-party code, so it is
  # also the job that holds no write token: `contents: read`, and a checkout that leaves no
  # credential behind for a lifecycle script to find. Its whole output is one artifact.
  build:
    name: Build the export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      # `persist-credentials: false` matters even at `contents: read`: the default checkout leaves a
      # credential for the job's token in `.git/config`, where every later step inherits it —
      # including `pnpm install`, which runs third-party lifecycle scripts, and the export, which
      # parses data fetched from the network. Nothing here needs one.
      #
      # No `fetch-depth: 0`: the rebase that needed full history is in `publish` now.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A prerequisite of the export, not a check on it: the exporter imports the Standard and the
      # validator as workspace packages, which resolve to their built `dist`.
      - name: Build
        run: pnpm build

      # Writes to a scratch directory rather than into the working tree, so a failed or short run
      # cannot leave a half-replaced `exports/` behind. The exporter's own floor (EXPORT_MIN_COUNT,
      # default 100) means an empty or half-loaded API publishes NOTHING and fails here instead.
      - name: Export the dataset from the live API
        env:
          EXPORT_API_URL: ${{ env.API_BASE_URL }}
          EXPORT_OUT_DIR: ${{ runner.temp }}/export
        run: pnpm --filter @the-rfp-hub/api export:api

      # The handover. Everything downstream of this point sees these files and nothing else from
      # this job — not the checkout, not node_modules, not $GITHUB_PATH.
      - name: Upload the snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: export-snapshot
          path: ${{ runner.temp }}/export
          if-no-files-found: error
          retention-days: 7

  # ── PUBLISH ─────────────────────────────────────────────────────────────────────────────────────
  # The only job with `contents: write`, and deliberately the emptiest one: a checkout, a download,
  # a name check, a copy and a commit. It runs no `pnpm install` and nothing out of this repository,
  # so there is no third-party code in the process tree that holds the token.
  publish:
    name: Publish to main
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The environment is where the deploy key lives, and its branch policy (main only) is what keeps
    # a workflow run from any other ref from ever being handed it.
    environment: nightly-export-publisher
    permissions:
      contents: read

    steps:
      # Full history: the push below rebases onto whatever main has become, which a shallow clone
      # cannot do. The checkout keeps its credential here — that is what this job is FOR, and the
      # reason the old single-job version had to refuse one (a credential in `.git/config` that
      # `pnpm install` could reach) does not exist in a job that never installs anything. With
      # `ssh-key` the credential is the deploy key: checkout points `origin` at the SSH URL and
      # wires the key through `core.sshCommand`, so the push below is made by the deploy key — the
      # ruleset's bypass actor — and not by the job token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.NIGHTLY_EXPORT_DEPLOY_KEY }}

      - name: Download the snapshot
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: export-snapshot
          path: ${{ runner.temp }}/snapshot

      # An artifact is INPUT, and this job is the one that can write to main — so its contents are
      # checked before anything is copied out of it, by name, against the six files the exporter
      # produces (packages/api/scripts/export-writer.ts). An allowlist rather than a denylist:
      # anything the build job did not mean to produce, a nested directory, a symlink, a stray
      # `.js`, stops the run instead of being committed. `find` rather than a glob so entries inside
      # subdirectories are seen as the paths they are.
      - name: Check the snapshot against the allowlist
        env:
          SNAPSHOT: ${{ runner.temp }}/snapshot
        run: |
          set -euo pipefail
          cd "$SNAPSHOT"
          bad=0
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            if [ ! -f "$entry" ] || [ -L "$entry" ]; then
              echo "::error::not a regular file: $entry"
              bad=1
              continue
            fi
            case "$entry" in
              LICENSE|latest.json|latest.csv|latest.manifest.json) ;;
              opportunities-*.json|opportunities-*.csv) ;;
              *) echo "::error::the export artifact carries an unexpected file: $entry"; bad=1 ;;
            esac
          done < <(find . -mindepth 1 -printf '%P\n')

          # And the other direction: the six have to all be there. A manifest that named archives
          # the artifact did not carry would publish a dataset that cannot be verified.
          for required in LICENSE latest.json latest.csv latest.manifest.json; do
            [ -f "$required" ] || { echo "::error::the export artifact is missing $required"; bad=1; }
          done
          for pattern in 'opportunities-*.json' 'opportunities-*.csv'; do
            # Unquoted on purpose: this is the one place the value is MEANT to expand as a glob.
            # With no match it stays literal and the -f test below fails, which is the answer.
            # shellcheck disable=SC2086
            set -- $pattern
            [ -f "$1" ] || { echo "::error::the export artifact carries no ${pattern} archive"; bad=1; }
            # Exactly one: a second archive of the same format would be copied and committed too,
            # and the manifest-driven verifier never enumerates the export root to notice it.
            [ "$#" -eq 1 ] || { echo "::error::the export artifact carries $# ${pattern} archives; expected exactly one"; bad=1; }
          done

          [ "$bad" -eq 0 ] || exit 1
          ls -l

      # `exports/` holds exactly ONE run: this run's six files, replacing the six before them. The
      # superseded snapshots are not lost — every one of them is in git history, which is a better
      # archive than a directory that grows by two files a day and that every clone has to carry.
      - name: Stage the snapshot
        env:
          SNAPSHOT: ${{ runner.temp }}/snapshot
        run: |
          set -euo pipefail
          mkdir -p exports
          find exports -maxdepth 1 -type f ! -name README.md -delete
          cp "$SNAPSHOT"/* exports/
          ls -l exports

      # The push goes through `origin`, which the checkout above pointed at the SSH remote with the
      # deploy key. Nothing here names a token.
      - name: Commit and push to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports

          if git diff --cached --quiet; then
            echo "nothing to publish — the export is byte-identical to what main already carries"
            exit 0
          fi

          git commit -m "data(exports): nightly snapshot $(date -u +%F)"

          # A human merge landing between this job's checkout and its push must not fail the job.
          # The commit is data only, so it rebases cleanly onto anything that is not itself an
          # `exports/` change — and nothing else writes that directory. A conflict therefore means
          # something genuinely unexpected touched the same files, which is worth stopping for
          # rather than resolving blind.
          #
          # Only a NON-FAST-FORWARD rejection is worth a retry. A ruleset rejection (GH013) means
          # the deploy key is no longer a bypass actor for main, and rebasing five times against
          # that only delays the same failure — so it stops on the first one and says why.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main 2>&1 | tee "$RUNNER_TEMP/push.log"; then
              exit 0
            fi
            if grep -q "GH013" "$RUNNER_TEMP/push.log"; then
              echo "::error::main rejected the push by repository rule — the deploy key must be listed as a bypass actor of the main ruleset"
              exit 1
            fi
            echo "push rejected (attempt ${attempt}/5) — rebasing onto the current main"
            git fetch origin main
            git rebase FETCH_HEAD || {
              git rebase --abort || true
              echo "rebase conflicted: something else changed exports/ — not resolving it here"
              exit 1
            }
            sleep $((attempt * 5))
          done

          echo "could not push after 5 attempts"
          exit 1

      # A commit is not a publication. raw.githubusercontent.com serves through a CDN that caches
      # for a few minutes, so this waits for the bytes a CONSUMER would actually receive —
      # deliberately with no cache-busting query parameter, which would prove something no consumer
      # can observe. The manifest is the right thing to poll: it is the run's single authoritative
      # pointer, replaced with one rename, so matching it means the whole file set is this run's.
      #
      # It stays in this job because it is `curl` and `sha256sum` — no repository code, no
      # node_modules, nothing that the token's presence here makes riskier.
      - name: Wait for the published manifest to be served
        run: |
          set -euo pipefail
          want="$(sha256sum exports/latest.manifest.json | cut -d ' ' -f 1)"
          echo "waiting for ${EXPORT_ROOT_URL}/latest.manifest.json to serve ${want}"
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            got="$(curl -fsS "${EXPORT_ROOT_URL}/latest.manifest.json" | sha256sum | cut -d ' ' -f 1 || true)"
            if [ "$got" = "$want" ]; then
              echo "published manifest is being served"
              exit 0
            fi
            echo "  not yet (serving ${got}) — retrying"
            sleep 20
          done
          echo "the published manifest was still not being served after 10 minutes"
          exit 1

  # ── VERIFY ──────────────────────────────────────────────────────────────────────────────────────
  # The gate, and a THIRD job only because of what it needs: `scripts/check-deployment.mjs` imports
  # ajv and loads the workspace validator, so running it means node_modules — which is exactly what
  # must not share a job with the write token. It cannot live in `publish`, and it cannot live in
  # `build` either, because there is nothing to verify until the push has happened.
  #
  # It downloads the export from its public URL and exercises the deployed API against the M2
  # criteria: liveness, every published OpenAPI operation, every served document against the
  # Standard, and the export's own freshness, licence and manifest — re-hashing the archives the
  # manifest names rather than believing the counts it states. Non-zero fails the run, so a green
  # run still cannot mean "published something nobody looked at".
  verify:
    name: Verify the publication
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The checker loads the workspace validator, which resolves to its built `dist`.
      - name: Build
        run: pnpm build

      - name: Verify the publication with the compliance checker
        run: |
          node scripts/check-deployment.mjs --milestone m2 \
            --api "$API_BASE_URL" --export-url "$EXPORT_ROOT_URL" \
            --json compliance-report.json

      # Kept whether the check passed or failed: a failing run is exactly when the itemized report
      # is worth reading.
      - name: Upload the compliance report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compliance-report
          path: compliance-report.json
          if-no-files-found: ignore
