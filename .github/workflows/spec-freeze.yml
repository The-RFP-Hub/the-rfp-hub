# Mechanises the one rule the standard's own history makes it hardest to keep.
#
# A published spec version is frozen: once it is declared stable, the artifacts that define
# it must never be edited again. That rule is enforced here rather than by memory, because
# the reasoning that justified re-cutting v1.0.0 in place ("nobody has adopted it yet")
# will feel true again next time, and the second time it will not be defensible.
#
# THE RULE ITSELF LIVES IN scripts/spec-freeze.mjs, not in this file. It compares the two
# revisions of every touched artifact by PARSING them and diffing their JSON structure — an
# earlier version of this gate did the comparison with `grep` over diff lines, and both of the
# ways it could be walked past were consequences of matching text instead of parsing JSON. The
# script's header documents what freezing covers, the three readings of "frozen", and the
# one-time provisional -> canonical identity adoption and how narrow it is; scripts/spec-freeze.test.mjs
# runs the bypass attempts as tests, so the gate's own claims are checked on every `pnpm test`.
#
# What this job cannot defend against is repo configuration: it must be a required status
# check (a deleted required workflow blocks merge as "expected"), main must require PRs, and
# .github/workflows/ AND scripts/spec-freeze.mjs should be CODEOWNERS-protected — none of which
# is expressible from inside the tree. The push trigger below is the tripwire for direct pushes:
# it cannot block them, but it turns main red so the bypass is at least loud.
#
# See packages/standard/PROCESS.md, packages/standard/NORMATIVE.md,
# adr/0001-recut-v1.0.0-in-place.md and adr/0007-canonical-domain-and-spec-identity.md.
name: Spec freeze

on:
  pull_request:
    paths:
      - "packages/standard/schemas/v*/**"
      - "packages/standard/conformance/v*/**"
      - "packages/standard/meta/**"
      - "packages/standard/registries/entry.schema.json"
      - "packages/standard/spec.config.json"
      - "scripts/spec-freeze.mjs"
  push:
    branches: [main]
    paths:
      - "packages/standard/schemas/v*/**"
      - "packages/standard/conformance/v*/**"
      - "packages/standard/meta/**"
      - "packages/standard/registries/entry.schema.json"
      - "packages/standard/spec.config.json"
      - "scripts/spec-freeze.mjs"

# The workflow token, narrowed to reading the checkout. Without a `permissions:` block a job gets
# whatever the repository's default Workflow permissions setting says — a checkbox in Settings that
# nothing in the tree can see, and that the same file would read differently on a fork. The token's
# scope must not depend on a repository setting, so it is stated here.
permissions:
  contents: read

jobs:
  frozen:
    name: Reject edits to frozen spec versions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # The gate reads git history and pushes nothing, so the checkout leaves no credential for
        # the token in `.git/config` for the later steps to inherit.
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # The gate runs from the BASE ref's copy of the script, not the head's. A PR that weakens
      # the gate must not be judged by the weakened gate — the same reason frozen-ness for a
      # version directory is read from the base. Reviewing the script change is a human job
      # (CODEOWNERS); this only stops the change from grading itself.
      - name: Check changed normative artifacts against FROZEN markers
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          gate=scripts/spec-freeze.mjs
          if [[ ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA:$gate" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/base-gate"
            git show "$BASE_SHA:$gate" > "$RUNNER_TEMP/base-gate/spec-freeze.mjs"
            gate="$RUNNER_TEMP/base-gate/spec-freeze.mjs"
            echo "· judging this change with the gate as it exists at the base ref"
          fi
          node "$gate" "$BASE_SHA" "$HEAD_SHA"
