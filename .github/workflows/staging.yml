on:
  push:
    branches:
      - main
    # The nightly export commits its dataset to `exports/` on main (see nightly-export.yml).
    # Publishing data must not roll the service: a push whose every changed file is under
    # `exports/` skips this workflow entirely, while a push that also touches anything else
    # deploys exactly as before. Tag pushes are unaffected — GitHub does not evaluate path filters
    # for them.
    paths-ignore: ['exports/**']
    tags:
      - 'stage-*'
  workflow_dispatch:

name: Staging RFP Hub API

# Build the image, push to ECR, then update the ECS task definition and
# service. The image carries NO configuration: every variable is supplied
# by the task definition's `secrets:` array, which resolves keys of the
# `staging/rfp-hub` Secrets Manager value at task start. See
# packages/api/docs/deploy.md.
#
# No DB migration job — Drizzle migrations (`pnpm migrate` in
# packages/api, or `node packages/api/dist/migrate.js` in this image) are
# a manual operator step against the staging RDS, not a per-deploy task.
# Gating the deploy on a migration one-off task is designed in
# docs/deploy.md ("Gating deploys on migrations") and needs a task
# definition, subnets/security groups and a DDL-capable credential that
# must exist before it can be wired in.

env:
  # The cluster is the hosting account's own resource name, not a fact about this project, so
  # it is a repository VARIABLE rather than a literal in a public, source-neutral tree (see
  # scripts/check-neutral.mjs). Set `STAGING_ECS_CLUSTER` under Settings -> Secrets and
  # variables -> Actions -> Variables. The deploy job below refuses to run while it is unset,
  # because an empty `cluster:` silently means ECS's `default` cluster.
  ECS_CLUSTER: ${{ vars.STAGING_ECS_CLUSTER }}
  ECR_REPOSITORY_MAIN: staging-rfp-hub
  ECS_CONTAINER: rfp-hub-staging

jobs:
  build_image:
    name: Build docker image
    if: |
      !failure() && !cancelled()
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          install: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # NOTE: no secret is fetched into the build context. Configuration reaches the container
      # through the ECS task definition's `secrets:` array (each entry resolving a key of the
      # `staging/rfp-hub` Secrets Manager value at task start), never through the image — see
      # packages/api/docs/deploy.md. The step that used to write `.env` here was removed together
      # with the Dockerfile's `COPY .env*`, because the layer cache below is `mode=max` and is
      # stored in this PUBLIC repository's Actions cache: every secret in a build layer was
      # readable by anyone who could read that cache. `scripts/check-deploy.mjs` guards the
      # Dockerfile/.dockerignore half of that fix in CI.

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx

      - name: Build image
        id: build-image
        uses: docker/build-push-action@v5
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY_MAIN }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_MAIN }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_MAIN }}:latest
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,mode=max,dest=/tmp/.buildx-cache-new

      - name: Move cache
        run: |
          if [ -d /tmp/.buildx-cache-new ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          else
            echo "No new Buildx cache generated; skipping cache move."
          fi

      - name: Discord notification
        uses: sarisia/actions-status-discord@v1
        if: failure()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}

  deploy-ecs-service:
    name: Deploy ECS service
    needs: [build_image]
    if: |
      !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail before touching AWS rather than after: `cluster:` empty is not an error to the
      # deploy action, it is a request for the account's `default` cluster.
      - name: Require the cluster variable
        run: |
          if [ -z "${{ env.ECS_CLUSTER }}" ]; then
            echo "::error::Repository variable STAGING_ECS_CLUSTER is unset (Settings -> Secrets and variables -> Actions -> Variables)."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.STAGING_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.STAGING_AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download task definition
        id: download-task
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY_MAIN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_CONTAINER }} --query taskDefinition > task-definition.json
          echo "revision=$(cat task-definition.json | jq .revision)" >> "$GITHUB_OUTPUT"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # The clean path's one hard prerequisite, checked where it bites: a task definition without
      # a `secrets:` mapping for DATABASE_URL means the container this deploy ships would boot
      # with no database at all — the image no longer bakes configuration, so this is the exact
      # first-deploy crash the migration ordering exists to prevent. Refusing HERE keeps the old
      # revision serving instead of shipping a crash-loop.
      - name: Require task-definition secret injection
        run: |
          if ! jq -e '.containerDefinitions[] | select(.name == "${{ env.ECS_CONTAINER }}") | .secrets[]? | select(.name == "DATABASE_URL")' task-definition.json > /dev/null; then
            echo "::error::the ${{ env.ECS_CONTAINER }} task definition carries no secrets: entry for DATABASE_URL. Add the secrets: array (and its execution-role policy) first — see packages/api/docs/deploy.md."
            exit 1
          fi

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.ECS_CONTAINER }}
          image: ${{ steps.download-task.outputs.image }}

      - name: Deploy Amazon ECS task definition and service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_CONTAINER }}-service
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Deregister previous revision
        run: |
          aws ecs deregister-task-definition --task-definition ${{ env.ECS_CONTAINER }}:${{ steps.download-task.outputs.revision }} >> /dev/null

      - name: Discord notification
        uses: sarisia/actions-status-discord@v1
        if: failure()
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}

  notification:
    needs: [build_image, deploy-ecs-service]
    if: |
      !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Discord success notification
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: 'Staging RFP Hub API deployed'
          description: 'Image: ${{ needs.build_image.outputs.image }}'
