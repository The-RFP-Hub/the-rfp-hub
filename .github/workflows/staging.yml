# Build the API image, push it to the container registry, run pending migrations as a one-off task,
# then roll the staging service onto the new revision.
#
# Nothing environment-specific is written down here. The registry repository, the cluster and the
# credentials all arrive from the `staging` GitHub Environment (secrets), and the two task-family
# names from that environment's variables. This file therefore names no account, cluster or
# registry — which is deliberate: this repository is public and source-neutral. (The hostname this
# environment serves, `https://api-staging.ethrfps.app`, is public by nature and is documented in
# packages/api/README.md; it is not a pipeline input — see the runtime-configuration note below.)
#
# Required in the `staging` GitHub Environment:
#   secrets    AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, ECR_REPOSITORY, ECS_CLUSTER,
#              DISCORD_WEBHOOK
#   variables  AWS_REGION, ECS_SERVICE_FAMILY, ECS_MIGRATION_FAMILY
#
# Nothing here validates any of them, and every wrong value fails late and unhelpfully — an
# unknown ECR repository fails at push, a wrong family fails at describe-task-definition, a
# wrong service name fails after the migration has already run. So the expected shape of each:
#
#   ECR_REPOSITORY        the repository NAME on its own, never a full registry URI — the
#                         registry host is prepended by the login step below. The repository is
#                         created as `<env>-rfp-hub`, so: `staging-rfp-hub`. It must match
#                         character for character, including the environment prefix.
#   ECS_SERVICE_FAMILY    the service task family, `rfp-hub-staging`. Two things are derived
#                         from it and are NOT separately configurable: the ECS service is this
#                         value plus `-service` (`rfp-hub-staging-service`), and the container
#                         inside the task definition is named this value exactly — which is why
#                         it is passed as `container-name` to the render step.
#   ECS_MIGRATION_FAMILY  the migration task family, `rfp-hub-migration-staging`; likewise the
#                         container name in that task definition.
#   AWS_REGION            the region the cluster and registry live in.
#   ECS_CLUSTER           the cluster name. A secret rather than a variable because it is the
#                         one value here that names shared, non-component infrastructure.
#
# Runtime configuration (DATABASE_URL and friends) is NOT set here and never passes through GitHub:
# the task definition pulls it from the secrets store at task start. That includes PUBLIC_BASE_URL
# (`https://api-staging.ethrfps.app` here) — so changing the advertised origin is a task-definition
# change plus a new deployment, never an edit to this file. See packages/api/README.md.
name: Deploy API (staging)

on:
  push:
    branches: [main]
    tags: ["stage-*"]
  workflow_dispatch:
    inputs:
      build_only:
        description: "Build and push the image, then stop (no migration, no service rollout)"
        type: boolean
        default: false
        required: false

# Deploys serialize instead of cancelling each other. A cancelled run is the worst outcome
# available: it stops between the migration and the rollout, skips the revision assertion, and
# skips the notification, so a half-applied deploy reports as neither success nor failure.
concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build_image:
    name: Build and push image
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Three tags, one image. `:latest` is what a task definition falls back to before any deploy
      # has pinned a digest; `:cron` is what the scheduled refresh task pins, so scheduled work
      # only moves when a deploy republishes it. Do not declare a job-level `outputs.image` here —
      # this action emits `imageid`/`digest`/`metadata`, never `image`, and a notification that
      # interpolates a non-existent output renders an empty line.
      - id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:cron
          cache-from: type=gha
          cache-to: type=gha,mode=max

  db_migrations:
    name: Run database migrations
    needs: [build_image]
    # `build_only` exists for the very first run against a brand-new registry repository, before
    # any service or task family has been created. A full run at that point fails red for reasons
    # that say nothing about the image, which is the one thing it is meant to prove.
    if: ${{ inputs.build_only != true }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read the current migration task definition
        id: download-task
        run: |
          aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query taskDefinition > task-definition.json
          echo "revision=$(jq -r '.revision' task-definition.json)" >> "$GITHUB_OUTPUT"
        env:
          FAMILY: ${{ vars.ECS_MIGRATION_FAMILY }}

      - name: Point the migration task at this commit's image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_MIGRATION_FAMILY }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # No `service:` — this registers the new revision and returns its ARN. Nothing is rolled out.
      - name: Register the migration task definition
        id: register
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: false

      # The service rollout below is gated on this: a non-zero migration fails the run here, with
      # the old revision still serving traffic.
      - name: Run the migration task
        run: bash ./deploy/migration.sh "$FAMILY" "$CLUSTER" "$TASK_DEFINITION_ARN"
        env:
          FAMILY: ${{ vars.ECS_MIGRATION_FAMILY }}
          CLUSTER: ${{ secrets.ECS_CLUSTER }}
          TASK_DEFINITION_ARN: ${{ steps.register.outputs.task-definition-arn }}

      - name: Deregister the previous migration revision
        run: aws ecs deregister-task-definition --task-definition "$FAMILY:$PREVIOUS_REVISION" > /dev/null
        env:
          FAMILY: ${{ vars.ECS_MIGRATION_FAMILY }}
          PREVIOUS_REVISION: ${{ steps.download-task.outputs.revision }}

  deploy_service:
    name: Deploy service
    needs: [build_image, db_migrations]
    if: ${{ inputs.build_only != true }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Read the current service task definition
        id: download-task
        run: |
          aws ecs describe-task-definition \
            --task-definition "$FAMILY" \
            --query taskDefinition > task-definition.json
          echo "revision=$(jq -r '.revision' task-definition.json)" >> "$GITHUB_OUTPUT"
        env:
          FAMILY: ${{ vars.ECS_SERVICE_FAMILY }}

      - name: Point the service task at this commit's image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ vars.ECS_SERVICE_FAMILY }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}

      # wait-for-minutes is 8, under this job's 10-minute timeout on purpose: a slow rollout has to
      # surface as a failed STEP (which notifies) rather than a cancelled JOB (which does not).
      # wait-max-delay-seconds caps the SDK's exponential backoff, which otherwise grows to polling
      # once every 10 minutes and can miss the whole rollout window.
      - name: Roll the service onto the new revision
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE_FAMILY }}-service
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 8
          wait-max-delay-seconds: 15

      - name: Assert the service moved to the new revision
        run: bash ./deploy/check_service_revision.sh "$((PREVIOUS_REVISION + 1))" "$SERVICE" "$CLUSTER"
        env:
          PREVIOUS_REVISION: ${{ steps.download-task.outputs.revision }}
          SERVICE: ${{ vars.ECS_SERVICE_FAMILY }}-service
          CLUSTER: ${{ secrets.ECS_CLUSTER }}

      - name: Deregister the previous service revision
        run: aws ecs deregister-task-definition --task-definition "$FAMILY:$PREVIOUS_REVISION" > /dev/null
        env:
          FAMILY: ${{ vars.ECS_SERVICE_FAMILY }}
          PREVIOUS_REVISION: ${{ steps.download-task.outputs.revision }}

  notify_deploy:
    name: Notify
    needs: [build_image, db_migrations, deploy_service]
    # always() rather than a !failure() guard: a cancelled or timed-out job must report failure.
    # A guard that only excludes failure() stays silent on exactly the runs worth alerting on.
    #
    # Deliberately NOT also gated on `build_only`. The build-only rehearsal is the first push to a
    # brand-new registry repository — the run most likely to fail, and the one whose failure is
    # least likely to be watched live. Skipping the notification there would make the pipeline
    # silent on exactly the run that exists to prove the pipeline works. `build_only` runs skip the
    # migration and deploy jobs, and a skipped job is neither failure nor cancelled, so the status
    # below still reads green when the build alone succeeded.
    if: always()
    runs-on: ubuntu-latest
    environment: staging
    env:
      DEPLOY_FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
    steps:
      # The outcome is stated in the title, not only in `status`. This action renders `title`
      # verbatim and expresses `status` solely as the embed's colour bar — so a fixed
      # "API deployed" caption on a failed run reads as a successful deploy in a mobile
      # notification preview, where the colour is not visible at all.
      - uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ env.DEPLOY_FAILED == 'true' && 'failure' || 'success' }}
          title: ${{ env.DEPLOY_FAILED == 'true' && 'API deploy FAILED (staging)' || (inputs.build_only == true && 'API image built and pushed (staging, build-only — not deployed)' || 'API deployed (staging)') }}
          description: "Commit: ${{ github.sha }}"
