# Deploys the frontend to PRODUCTION when a release tag is pushed.
#
# Two tag families trigger it: `prod-*` — the repository's whole-product release tag, which also
# deploys the API (production.yml), so one tag moves both halves and the frontend's baked
# NEXT_PUBLIC_API_URL always points at an API of the same release — and `frontend-prod-*`, for a
# frontend-only release when the API is not changing. The rationale for CLI-driven deploys, and
# for why the Git integration cannot express "production moves on a tag", is in
# frontend-staging.yml; this workflow is its production twin: same steps, production environment,
# `--prod` deploy. The production domain is assigned by Vercel to the promoted deployment, so no
# alias step is needed here.
#
# Rollback is a git operation: push a new `frontend-prod-*` tag pointing at the previous good
# commit (or dispatch this workflow with that tag).
name: Production frontend

on:
  push:
    tags:
      - "prod-*"
      - "frontend-prod-*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to deploy (e.g. frontend-prod-2026-08-19)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # One production deploy at a time, and a superseded one must not be cancelled mid-flight —
  # a half-promoted production is worse than a queued one.
  group: frontend-production
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Blank on a tag push (checks out the pushed tag); the dispatched form names one.
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel environment (production)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
