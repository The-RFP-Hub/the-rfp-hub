# Publishes one workspace package to npm with provenance, through npm trusted publishing: the job's
# OIDC identity is the credential, so there is no token to store or rotate. A laptop has no such
# identity, which is why this is a workflow. See docs/deployment.md §7.5.
name: npm Publish

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Release tag to publish from, e.g. @the-rfp-hub/mcp@0.1.3"
        required: true
        type: string
      package:
        description: "Workspace package to publish"
        required: true
        type: choice
        options:
          - "@the-rfp-hub/mcp"
          - "rfphub-validate"
          - "@the-rfp-hub/standard"
      tag:
        description: "npm dist-tag to publish under"
        required: true
        type: choice
        options: [next, latest]
        default: next

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PKG: ${{ inputs.package }}
      REF: ${{ inputs.ref }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Require a tag, and `next` for the MCP server
        run: |
          if ! git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${REF}" > /dev/null; then
            echo "::error::'${REF}' is not a tag on this repository. Publish from the release tag."
            exit 1
          fi
          # `latest` is what an unpinned install resolves to, and the MCP server earns it only once
          # the M4 profile is green against the published tarball. See docs/deployment.md §7.6.
          if [ "${PKG}" = "@the-rfp-hub/mcp" ] && [ "${TAG}" = "latest" ]; then
            echo "::error::${PKG} publishes to 'next'; promote it with 'npm dist-tag add' once the M4 check is green."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Qualified: an unqualified ref lets a branch of the same name win over the tag.
          ref: refs/tags/${{ inputs.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm 11.5 or newer; the npm bundled with Node 22 is older.
      - run: npm install -g npm@latest && npm --version

      - run: pnpm install --frozen-lockfile

      # `...` selects the package AND its workspace dependencies: on a clean runner nothing has
      # built @the-rfp-hub/standard yet, so rfphub-validate cannot resolve it and the MCP server
      # cannot resolve either of them.
      - run: pnpm --filter "${PKG}..." build

      - run: pnpm --filter "${PKG}..." test

      # The tag names the version being released, so the tarball must agree with it — and a
      # `workspace:*` that survived the pack is a package nobody outside this repo can install.
      - name: The tarball agrees with the tag
        run: |
          expected="${REF##*@}"
          if [ "${REF%@*}" != "${PKG}" ]; then
            echo "::error::tag '${REF}' does not name ${PKG}"
            exit 1
          fi
          pnpm --filter "${PKG}" pack --pack-destination /tmp/pack
          tarball=$(ls /tmp/pack/*.tgz)
          manifest=$(tar -xzOf "${tarball}" package/package.json)
          actual=$(echo "${manifest}" | jq -r .version)
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::${tarball} is version ${actual}; tag ${REF} says ${expected}"
            exit 1
          fi
          if echo "${manifest}" | jq -e '[.dependencies//{},.peerDependencies//{}|to_entries[]|select(.value|startswith("workspace:"))]|length>0' > /dev/null; then
            echo "::error::the tarball still declares a workspace:* dependency"
            echo "${manifest}" | jq '.dependencies'
            exit 1
          fi
          echo "VERSION=${expected}" >> "$GITHUB_ENV"
          echo "TARBALL=${tarball}" >> "$GITHUB_ENV"

      # The tarball pnpm packed (workspace:* already rewritten), published by npm itself: npm is what
      # exchanges the OIDC token for the trusted-publishing credential.
      - name: Publish
        run: npm publish "${TARBALL}" --access public --tag "${TAG}" --provenance

      - name: The registry serves an attestation
        run: |
          attestations=$(npm view "${PKG}@${VERSION}" dist.attestations --json 2>/dev/null || echo null)
          if [ "${attestations}" = "null" ] || [ -z "${attestations}" ]; then
            echo "::error::${PKG}@${VERSION} was published without provenance"
            exit 1
          fi
          echo "${attestations}"
