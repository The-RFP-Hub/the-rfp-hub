# The Playwright suite against a real stack the runner boots itself.
#
# Deliberately NOT on `pull_request`: bringing up Postgres, the API and the frontend for every push
# to every branch costs more than it catches. A regression is therefore caught after merge rather
# than before it, which is the trade this file makes on purpose.
name: E2E

on:
  push:
    branches: [main]
    paths-ignore: ['exports/**']
  schedule:
    # `schedule` only ever fires from the default branch, so this begins running once this file is
    # on `main` and not before.
    - cron: "27 4 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: "responsive (one spec) or full (the whole Playwright suite)"
        type: choice
        options: [responsive, full]
        default: responsive

# Without a `permissions:` block a job gets the repository default — see ci.yml for the reasoning.
permissions:
  contents: read

concurrency:
  # Keyed on the event as well as the ref: a push and the nightly schedule share refs/heads/main,
  # and a nightly full run must never be cancelled by an unrelated merge.
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the validator chain the frontend resolves
        run: pnpm --filter rfphub-validate... build

      - name: Install Chromium for Playwright
        run: pnpm --filter @the-rfp-hub/e2e exec playwright install --with-deps chromium

      - name: Which suite
        id: suite
        env:
          SUITE_INPUT: ${{ github.event.inputs.suite }}
        run: |
          set -euo pipefail
          if [ -n "${SUITE_INPUT:-}" ]; then
            echo "suite=$SUITE_INPUT" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "suite=full" >> "$GITHUB_OUTPUT"
          else
            echo "suite=responsive" >> "$GITHUB_OUTPUT"
          fi

      # A rename of the spec has to fail here, not fifteen minutes into a stack bring-up. The
      # config reads a state file at import time, so listing needs a stub but no stack.
      - name: The filter still selects the spec
        if: steps.suite.outputs.suite == 'responsive'
        shell: bash
        working-directory: packages/e2e
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/e2e-list-state.json"
          echo '{"urls":{"frontend":"http://127.0.0.1:1"},"storageStatePath":"/dev/null"}' > "$state"
          listing=$(E2E_STATE_FILE="$state" pnpm exec playwright test responsive.spec.ts --list)
          echo "$listing"
          grep -qE 'Total: [1-9]' <<<"$listing"

      - name: Run responsive.spec.ts through the real E2E runner
        if: steps.suite.outputs.suite == 'responsive'
        run: pnpm e2e -- responsive.spec.ts

      - name: Run the full suite
        if: steps.suite.outputs.suite == 'full'
        run: pnpm e2e

      # A skipped case is a green gate that asserted nothing. Scoped to the spec: the setup project
      # skips one case by design when no earlier run recorded an administrator.
      - name: Every responsive case ran
        if: steps.suite.outputs.suite == 'responsive'
        shell: bash
        run: |
          set -euo pipefail
          cases=$(jq '[.tests[] | select(.file | endswith("responsive.spec.ts"))]' \
            packages/e2e/test-results/e2e-report.json)
          total=$(jq 'length' <<<"$cases")
          skipped=$(jq '[.[] | select(.status == "skipped")] | length' <<<"$cases")
          echo "responsive.spec.ts: total=$total skipped=$skipped"
          if [ "$total" -lt 1 ] || [ "$skipped" -ne 0 ]; then
            jq -r '.[] | "\(.status)\t\(.title)\t\(.reason // "")"' <<<"$cases"
            echo "::error::the responsive gate must execute every case in responsive.spec.ts"
            exit 1
          fi

      # The full suite HAS legitimate skips — the setup project's cross-run assertion skips on an
      # ordinary first run — so rejecting every skipped case would redden every night. The reporter
      # separates the two; this asserts the one that means something.
      - name: Nothing was blocked
        if: steps.suite.outputs.suite == 'full'
        shell: bash
        run: |
          set -euo pipefail
          report=packages/e2e/test-results/e2e-report.json
          blocked=$(jq '.counts.blockedByMissingConfig' "$report")
          echo "blocked cases: $blocked"
          if [ "$blocked" -ne 0 ]; then
            jq -r '.tests[] | select(.blockedByConfig) | "\(.file)\t\(.title)\t\(.reason // "")"' "$report"
            echo "::error::the nightly suite must not be blocked from asserting anything"
            exit 1
          fi

      - name: Upload the Playwright report (only on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7
