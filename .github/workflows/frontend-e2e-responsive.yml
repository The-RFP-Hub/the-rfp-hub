# Runs one spec through the real E2E runner (`packages/e2e/src/run.ts`), which owns the Postgres,
# API and frontend it needs. Requires packages/e2e/tests/m4-responsive.spec.ts (merged with the
# directory-filters change). The two guard steps exist because both halves of the selection fail
# open: a filter matching nothing, and a spec skipping itself, are each a green run of nothing.
name: Frontend responsive E2E

on:
  push:
    branches: [main]
    paths: &responsive-e2e-paths
      - "packages/frontend/**"
      - "packages/e2e/**"
      - "packages/validate/**"
      - "packages/standard/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/frontend-e2e-responsive.yml"
  pull_request:
    branches: [main]
    paths: *responsive-e2e-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    name: m4-responsive.spec.ts (real stack, one spec)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `transpilePackages` does not change which file Node resolves: both still resolve via `dist/`.
      - name: Build workspace dependencies (@the-rfp-hub/standard, rfphub-validate)
        run: pnpm --filter rfphub-validate... build

      - name: Install Chromium for Playwright
        run: pnpm --filter @the-rfp-hub/e2e exec playwright install --with-deps chromium

      # A rename of the spec has to fail here, not fifteen minutes into a stack bring-up. The
      # config reads a state file at import time, so listing needs a stub but no stack.
      - name: The filter still selects the spec
        shell: bash
        working-directory: packages/e2e
        run: |
          state="$RUNNER_TEMP/e2e-list-state.json"
          echo '{"urls":{"frontend":"http://127.0.0.1:1"},"storageStatePath":"/dev/null"}' > "$state"
          listing=$(E2E_STATE_FILE="$state" pnpm exec playwright test m4-responsive.spec.ts --list)
          echo "$listing"
          grep -qE 'Total: [1-9]' <<<"$listing"

      - name: Run m4-responsive.spec.ts through the real E2E runner
        run: pnpm e2e -- m4-responsive.spec.ts

      # A skipped case is a green gate that asserted nothing. Scoped to the spec: the setup project
      # skips one case by design when no earlier run recorded an administrator.
      - name: Every responsive case ran
        shell: bash
        run: |
          cases=$(jq '[.tests[] | select(.file | endswith("m4-responsive.spec.ts"))]' \
            packages/e2e/test-results/m3-e2e.json)
          total=$(jq 'length' <<<"$cases")
          skipped=$(jq '[.[] | select(.status == "skipped")] | length' <<<"$cases")
          echo "m4-responsive.spec.ts: total=$total skipped=$skipped"
          if [ "$total" -lt 1 ] || [ "$skipped" -ne 0 ]; then
            jq -r '.[] | "\(.status)\t\(.title)\t\(.reason // "")"' <<<"$cases"
            echo "::error::the responsive gate must execute every case in m4-responsive.spec.ts"
            exit 1
          fi

      - name: Upload the Playwright report (only on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m4-responsive-playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 7
