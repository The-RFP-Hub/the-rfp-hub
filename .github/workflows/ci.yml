name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Postgres for the @the-rfp-hub/api integration tests (gated on DATABASE_URL; otherwise skipped).
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: rfphub
          POSTGRES_PASSWORD: rfphub
          POSTGRES_DB: rfphub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rfphub -d rfphub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://rfphub:rfphub@localhost:5432/rfphub

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Type drift check (generated artifacts vs schema + spec.config.json)
        run: pnpm codegen:check

      # Publication rules: context↔schema drift, version-string agreement, source neutrality.
      - name: Spec publication rules
        run: pnpm check

      # Same neutrality rule, repo-wide: no internal tracker IDs anywhere in a public repo.
      - name: Source neutrality (repo-wide)
        run: pnpm check:neutral

      # Build first: validate's typecheck/tests resolve @the-rfp-hub/standard from its built dist.
      - name: Build
        run: pnpm build

      - name: Migrate API database (for integration tests)
        run: pnpm --filter @the-rfp-hub/api migrate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      # The TypeScript example is a CONSUMER, not a workspace member: it resolves
      # @the-rfp-hub/standard from the npm REGISTRY (npm, not pnpm — no workspace linking), so this
      # typechecks it against the PUBLISHED package and a release that breaks downstream consumers
      # fails here instead of in their repos.
      #
      # `npm ci` against the committed lockfile, not `npm install`: the version resolved is pinned,
      # so an unrelated transitive publish cannot redden CI on an unrelated PR. Bumping the standard
      # here is therefore a deliberate lockfile change.
      #
      # Scope, so nobody reads more into a green tick than it earns: this step covers ONLY
      # examples/typescript/index.ts. It issues no HTTP request, so no runtime API behaviour is
      # verified; it does not look at the curl or Python examples; and because it resolves the
      # registry copy, a change to packages/standard in this repo cannot fail it.
      - name: Typecheck the TypeScript client example (as a consumer)
        working-directory: examples/typescript
        run: |
          npm ci
          npm run typecheck
