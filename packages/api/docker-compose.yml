# ============================================================================
# PERSISTENT DEV DATABASE — DO NOT `down -v` / RECREATE FROM AUTOMATION.
#
# This is the long-lived local Postgres for the RFP Hub /v1/ API (M2): named
# volume (rfphub_pgdata), `restart: unless-stopped`, pinned port 5432 and
# container name rfphub-postgres. It holds real seeded dev data — running
# `docker compose down -v` here DESTROYS it.
#
# Test automation / CI must NOT use this file. For integration tests use the
# throwaway docker-compose.test.yml (tmpfs, port 5439, rfphub-test-pg) — see
# "Integration tests" in README.md.
#
# Cloud target chosen later in the milestone.
# ============================================================================
services:
  postgres:
    # pgvector's image, not the plain one: M3 stores opportunity embeddings in a `vector(1536)`
    # column with an HNSW index, and `CREATE EXTENSION vector` fails on an image that does not ship
    # the extension. SAME MAJOR VERSION (15), so the existing rfphub_pgdata volume is reused — an
    # image change recreates the CONTAINER, never the volume. The base image does change from
    # alpine/musl to debian/glibc, which changes the collation provider version: run
    # `scripts/upgrade-dev-postgres.sh` rather than `docker compose up -d` by hand, so the dump,
    # the collation refresh, the reindex and the row-count comparison all happen.
    image: pgvector/pgvector:pg15
    container_name: rfphub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rfphub
      POSTGRES_PASSWORD: rfphub
      POSTGRES_DB: rfphub
    ports:
      - "5432:5432"
    volumes:
      - rfphub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfphub -d rfphub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rfphub_pgdata:
